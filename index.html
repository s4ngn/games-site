<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" href="https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico">
    <style>
        body { margin: 0; background: #f5f5f5; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .fake-page { text-align: center; color: #333; }
        .fake-page h1 { font-size: 28px; font-weight: 600; margin-bottom: 10px; }
        .fake-page p { color: #666; }
        #click-trigger { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999999; cursor: pointer; background: transparent; border: none; }
    </style>
</head>
<body>

    <button id="click-trigger"></button>

    <div class="fake-page">
        <h1>Assignment Dashboard</h1>
        <p>Click anywhere to load your learning modules.</p>
    </div>

    <script id="hub-template" type="text/template">
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <title>Academic Hub</title>
            <style>
                :root { --primary: #a855f7; --bg: #09090b; --card-bg: #18181b; --text: #f4f4f5; }
                body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
                
                /* Left Sidebar */
                .sidebar { width: 220px; background: #121214; padding: 20px; border-right: 1px solid #27272a; display: flex; flex-direction: column; gap: 10px; }
                .logo { font-size: 24px; font-weight: 900; color: #fff; letter-spacing: 1px; margin-bottom: 20px; text-shadow: 0 0 10px var(--primary); }
                .nav-item { color: #a1a1aa; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; }
                .nav-item.active { background: #27272a; color: #fff; border-left: 3px solid var(--primary); }
                
                /* Main Content */
                .main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 0 20px 20px; }
                .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #27272a; margin-bottom: 20px; }
                .search-bar { background: #18181b; border: 1px solid #3f3f46; padding: 10px 15px; border-radius: 8px; color: #fff; width: 300px; outline: none; }
                .hero { background: linear-gradient(135deg, #2e1065, #09090b); border-radius: 12px; padding: 40px; margin-bottom: 30px; text-align: center; border: 1px solid #4c1d95; }
                .hero h1 { margin: 0; font-size: 36px; font-weight: 900; }
                .hero p { color: #d8b4fe; font-size: 18px; }
                .section-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
                .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
                .game-card { background: var(--card-bg); border-radius: 10px; overflow: hidden; cursor: pointer; border: 1px solid #27272a; transition: transform 0.2s; display: flex; flex-direction: column; }
                .game-card:hover { transform: translateY(-5px); border-color: var(--primary); }
                .game-cover { height: 120px; background: #2e1065; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #d8b4fe; font-size: 18px; text-align: center; padding: 10px; box-sizing: border-box; border-bottom: 2px solid #4c1d95;}
                .game-info { padding: 12px; text-align: center;}
                .game-info h3 { margin: 0; font-size: 15px; }
                
                /* Right Sidebar (Stacked Ads) */
                .right-sidebar { width: 200px; background: #121214; padding: 10px; border-left: 1px solid #27272a; display: flex; flex-direction: column; align-items: center; overflow-y: auto;}
                .ad-stack { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 10px;}
                .ad-slot { width: 100%; min-height: 150px; display: flex; justify-content: center; align-items: flex-start; }

                #game-player { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; flex-direction: column; }
                #game-player iframe { width: 100%; height: 100%; border: none; }
                .close-btn { position: absolute; top: 10px; right: 20px; background: #ff4444; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; z-index: 1001; font-weight: bold; }
            </style>
        </head>
        <body>
            
            <div class="sidebar">
                <div class="logo">ACADEMIC HUB</div>
                <div class="nav-item active">Home</div>
                <div class="nav-item">Trending</div>
                <div class="nav-item">New Games</div>
            </div>
            
            <div class="main">
                <div class="top-bar"><input type="text" class="search-bar" placeholder="Search games..." onkeyup="searchGames()" id="searchInput"></div>
                <div class="hero"><h1>PLAY MORE.<br>WAIT LESS.</h1><p>The best unblocked games.</p></div>
                <div class="section-title">🔥 Trending Games</div>
                <div class="game-grid" id="gameGrid"></div>
            </div>

            <!-- RIGHT SIDEBAR (ONLY ADS HERE) -->
            <div class="right-sidebar">
                <div class="ad-stack">
                    
                    <!-- AD SLOT 1 -->
                    <div class="ad-slot">
                        <!-- BEGIN AADS AD UNIT 1 (YOUR EXISTING CODE) -->
                        <div id="frame" style="width: 100%;margin: auto;position: relative; z-index: 99998;">
                            <iframe data-aa='2459180' src='//acceptable.a-ads.com/2459180/?size=Adaptive' style='border:0; padding:0; width:100%; height:auto; overflow:hidden;display: block;margin: auto'></iframe>
                        </div>
                        <!-- END AADS AD UNIT 1 -->
                    </div>

                    <!-- AD SLOT 2 -->
                    <div class="ad-slot">
                        <!-- PASTE 2ND A-ADS IFRAME HERE -->
                    </div>

                    <!-- AD SLOT 3 -->
                    <div class="ad-slot">
                        <!-- PASTE 3RD A-ADS IFRAME HERE -->
                    </div>

                </div>
            </div>

            <div id="game-player"><button class="close-btn" onclick="closeGame()">Exit to Hub</button><iframe id="gameFrame" src="about:blank"></iframe></div>
            
            <script>
                const games = [
                    { id: 1, title: "Slope", url: "/games/slope/index.html" },
                    { id: 2, title: "Retro Bowl", url: "/games/retro-bowl/index.html" },
                    { id: 3, title: "1v1.lol", url: "/games/1v1/index.html" },
                    { id: 4, title: "OvO", url: "/games/ovo/index.html" }
                ];
                function renderGames(gameList) {
                    const grid = document.getElementById('gameGrid');
                    grid.innerHTML = '';
                    gameList.forEach(game => {
                        const card = document.createElement('div');
                        card.className = 'game-card';
                        card.innerHTML = '<div class="game-cover">' + game.title + '</div><div class="game-info"><h3>' + game.title + '</h3></div>';
                        card.onclick = () => launchGame(game);
                        grid.appendChild(card);
                    });
                }
                let isGameLaunching = false;
                function launchGame(game) {
                    if (isGameLaunching) return;
                    isGameLaunching = true;
                    if (!sessionStorage.getItem('ad_shown')) {
                        sessionStorage.setItem('ad_shown', 'true');
                        setTimeout(() => { window.open('https://google.com', '_blank'); }, 500); // REPLACE WITH AADS POPUNDER LINK
                    }
                    document.getElementById('game-player').style.display = 'flex';
                    document.getElementById('gameFrame').src = game.url;
                    setTimeout(() => { isGameLaunching = false; }, 1000);
                }
                function closeGame() {
                    document.getElementById('game-player').style.display = 'none';
                    document.getElementById('gameFrame').src = 'about:blank';
                }
                function searchGames() {
                    const query = document.getElementById('searchInput').value.toLowerCase();
                    renderGames(games.filter(g => g.title.toLowerCase().includes(query)));
                }
                renderGames(games);
            </script>
        </body>
        </html>
    </script>

    <script>
        let isLaunching = false;

        function launchHub() {
            if (isLaunching) return;
            isLaunching = true;

            const popup = window.open('about:blank', 'AssignmentViewer', 'width=1200,height=800,menubar=no,toolbar=no,location=no,status=no');
            
            if (!popup) {
                alert("Please allow popups for this site.");
                isLaunching = false;
                return;
            }

            const template = document.getElementById('hub-template').innerHTML;

            popup.document.open();
            popup.document.write(template);
            popup.document.close();
            
            document.querySelector('.fake-page h1').innerText = "Assignment Loaded Successfully.";
            document.querySelector('.fake-page p').innerText = "You may now close this tab.";
            
            setTimeout(() => { isLaunching = false; }, 2000);
        }

        document.getElementById('click-trigger').addEventListener('click', launchHub);
    </script>
</body>
</html>
