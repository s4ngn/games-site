<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" href="https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        body { 
            margin: 0; 
            background: #020810; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: #fff;
        }

        .fake-page { text-align: center; color: #333; } /* Stealth White Page */
        .fake-page h1 { font-size: 28px; font-weight: 600; margin-bottom: 10px; color: #333;}
        .fake-page p { color: #666; }
        #click-trigger { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999999; cursor: pointer; background: transparent; border: none; }
    </style>
</head>
<body>

    <button id="click-trigger"></button>

    <div class="fake-page">
        <h1>Assignment Dashboard</h1>
        <p>Click anywhere to load your learning modules.</p>
    </div>

    <script id="hub-template" type="text/template">
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <title>Academic Hub</title>
            <style>
                @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
                
                :root { 
                    --primary: #a855f7; 
                    --bg: #020810; 
                    --glass: rgba(20, 25, 35, 0.6);
                    --border: rgba(255, 255, 255, 0.08);
                    --text: #f4f4f5; 
                }

                body { 
                    margin: 0; 
                    background: url('https://images.unsplash.com/photo-1514565131-fce0801e5785?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed; 
                    background-size: cover;
                    color: var(--text); 
                    font-family: 'Inter', sans-serif; 
                    display: flex; 
                    height: 100vh; 
                    overflow: hidden;
                    backdrop-filter: blur(5px);
                }

                /* Dark overlay to make text readable */
                body::before {
                    content: '';
                    position: absolute;
                    top: 0; left: 0; width: 100%; height: 100%;
                    background: rgba(2, 8, 16, 0.7);
                    z-index: -1;
                }
                
                /* Left Sidebar */
                .sidebar { 
                    width: 240px; 
                    background: var(--glass); 
                    padding: 30px 20px; 
                    border-right: 1px solid var(--border); 
                    display: flex; 
                    flex-direction: column; 
                    gap: 15px; 
                    flex-shrink: 0;
                    backdrop-filter: blur(20px);
                }
                .logo { 
                    font-size: 28px; 
                    font-weight: 800; 
                    color: #fff; 
                    letter-spacing: -1px; 
                    margin-bottom: 30px; 
                    text-shadow: 0 0 20px rgba(168, 85, 247, 0.8); 
                }
                .nav-item { 
                    color: #a1a1aa; 
                    padding: 12px 16px; 
                    border-radius: 8px; 
                    font-weight: 600; 
                    cursor: pointer; 
                    transition: 0.2s;
                }
                .nav-item:hover { color: #fff; background: rgba(255,255,255,0.05); }
                .nav-item.active { 
                    background: rgba(168, 85, 247, 0.15); 
                    color: #fff; 
                    border-left: 3px solid var(--primary); 
                }
                
                /* Main Content */
                .main { 
                    flex: 1; 
                    display: flex; 
                    flex-direction: column; 
                    overflow-y: auto; 
                    padding: 40px; 
                }
                
                /* Top Bar */
                .top-bar { 
                    display: flex; 
                    justify-content: center; 
                    align-items: center; 
                    margin-bottom: 40px; 
                }
                .search-bar { 
                    background: rgba(0, 0, 0, 0.5); 
                    border: 1px solid var(--border); 
                    padding: 15px 25px; 
                    border-radius: 12px; 
                    color: #fff; 
                    width: 100%; 
                    max-width: 600px; 
                    outline: none; 
                    font-family: 'Inter', sans-serif;
                    font-size: 16px;
                    transition: 0.3s;
                    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
                }
                .search-bar:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
                
                /* Hero */
                .hero { 
                    background: linear-gradient(135deg, rgba(46, 16, 101, 0.8), rgba(9, 9, 11, 0.8)); 
                    border-radius: 16px; 
                    padding: 50px; 
                    margin-bottom: 40px; 
                    text-align: center; 
                    border: 1px solid rgba(168, 85, 247, 0.3); 
                    backdrop-filter: blur(10px);
                    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                }
                .hero h1 { margin: 0; font-size: 42px; font-weight: 800; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
                .hero p { color: #d8b4fe; font-size: 18px; font-weight: 400; margin-top: 10px; }
                
                .section-title { font-size: 22px; font-weight: 800; margin-bottom: 20px; color: #fff; letter-spacing: -0.5px; }
                
                /* Game Grid */
                .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
                .game-card { 
                    background: var(--glass); 
                    border-radius: 12px; 
                    overflow: hidden; 
                    cursor: pointer; 
                    border: 1px solid var(--border); 
                    transition: 0.3s; 
                    display: flex; 
                    flex-direction: column; 
                    backdrop-filter: blur(10px);
                }
                .game-card:hover { 
                    transform: translateY(-5px); 
                    border-color: var(--primary); 
                    box-shadow: 0 10px 20px rgba(168, 85, 247, 0.2);
                }
                .game-cover { 
                    height: 130px; 
                    background: linear-gradient(135deg, rgba(46,16,101,0.5), rgba(9,9,11,0.5)); 
                    display: flex; 
                    align-items: center; 
                    justify-content: center; 
                    font-weight: 800; 
                    color: #d8b4fe; 
                    font-size: 20px; 
                    text-align: center; 
                    padding: 10px; 
                    box-sizing: border-box; 
                    border-bottom: 1px solid var(--border);
                }
                .game-info { padding: 15px; text-align: center; }
                .game-info h3 { margin: 0; font-size: 16px; font-weight: 600; color: #fff; }
                
                /* Right Sidebar - Ads */
                .right-sidebar { 
                    width: 220px; 
                    background: var(--glass); 
                    padding: 20px 10px; 
                    border-left: 1px solid var(--border); 
                    display: flex; 
                    flex-direction: column; 
                    align-items: center; 
                    gap: 20px; 
                    overflow-y: auto;
                    flex-shrink: 0;
                    backdrop-filter: blur(20px);
                }
                .ad-slot { 
                    width: 100%; 
                    min-height: 160px; 
                    display: flex; 
                    justify-content: center; 
                    align-items: flex-start; 
                    border-radius: 8px;
                    overflow: hidden;
                    border: 1px solid transparent;
                }
                .ad-slot:hover { border-color: rgba(255,255,255,0.1); }

                /* Game Player */
                #game-player { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; flex-direction: column; }
                #game-player iframe { width: 100%; height: 100%; border: none; }
                .close-btn { position: absolute; top: 15px; right: 25px; background: #ff4444; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; z-index: 1001; font-weight: 600; font-family: 'Inter', sans-serif; transition: 0.2s; }
                .close-btn:hover { background: #cc0000; }
            </style>
        </head>
        <body>
            
            <!-- LEFT SIDEBAR -->
            <div class="sidebar">
                <div class="logo">ACADEMIC HUB</div>
                <div class="nav-item active">Home</div>
                <div class="nav-item">Trending</div>
                <div class="nav-item">New Games</div>
            </div>
            
            <!-- MAIN CONTENT -->
            <div class="main">
                <div class="top-bar">
                    <input type="text" class="search-bar" placeholder="Search for games, modules, or tools..." onkeyup="searchGames()" id="searchInput">
                </div>
                <div class="hero">
                    <h1>PLAY MORE.<br>WAIT LESS.</h1>
                    <p>The best unblocked games. All in one place.</p>
                </div>
                <div class="section-title">🔥 Trending Games</div>
                <div class="game-grid" id="gameGrid"></div>
            </div>

            <!-- RIGHT SIDEBAR (STACKED ADS) -->
            <div class="right-sidebar">
                
                <!-- AD SLOT 1 -->
                <div class="ad-slot">
                    <iframe srcdoc="<body style='margin:0;padding:0;background:transparent;'><!-- BEGIN AADS AD UNIT 2459181 --><div id='frame' style='width: 100%;margin: auto;position: relative; z-index: 99998;'><iframe data-aa='2459181' src='//acceptable.a-ads.com/2459181/?size=Adaptive' style='border:0; padding:0; width:100%; height:auto; overflow:hidden;display: block;margin: auto;background:transparent;'></iframe></div><!-- END AADS AD UNIT 2459181 --></body>" style="width:100%; height:100%; border:none; overflow:hidden; background:transparent;"></iframe>
                </div>

                <!-- AD SLOT 2 -->
                <div class="ad-slot">
                    <iframe srcdoc="<body style='margin:0;padding:0;background:transparent;'><!-- BEGIN AADS AD UNIT 2459184 --><div id='frame' style='width: 100%;margin: auto;position: relative; z-index: 99998;'><iframe data-aa='2459184' src='//acceptable.a-ads.com/2459184/?size=Adaptive' style='border:0; padding:0; width:100%; height:auto; overflow:hidden;display: block;margin: auto;background:transparent;'></iframe></div><!-- END AADS AD UNIT 2459184 --></body>" style="width:100%; height:100%; border:none; overflow:hidden; background:transparent;"></iframe>
                </div>

                <!-- AD SLOT 3 -->
                <div class="ad-slot">
                    <iframe srcdoc="<body style='margin:0;padding:0;background:transparent;'><!-- BEGIN AADS AD UNIT 2459185 --><div id='frame' style='width: 100%;margin: auto;position: relative; z-index: 99998;'><iframe data-aa='2459185' src='//acceptable.a-ads.com/2459185/?size=Adaptive' style='border:0; padding:0; width:100%; height:auto; overflow:hidden;display: block;margin: auto;background:transparent;'></iframe></div><!-- END AADS AD UNIT 2459185 --></body>" style="width:100%; height:100%; border:none; overflow:hidden; background:transparent;"></iframe>
                </div>

                <!-- AD SLOT 4 -->
                <div class="ad-slot">
                    <iframe srcdoc="<body style='margin:0;padding:0;background:transparent;'><!-- BEGIN AADS AD UNIT 2459186 --><div id='frame' style='width: 100%;margin: auto;position: relative; z-index: 99998;'><iframe data-aa='2459186' src='//acceptable.a-ads.com/2459186/?size=Adaptive' style='border:0; padding:0; width:100%; height:auto; overflow:hidden;display: block;margin: auto;background:transparent;'></iframe></div><!-- END AADS AD UNIT 2459186 --></body>" style="width:100%; height:100%; border:none; overflow:hidden; background:transparent;"></iframe>
                </div>

            </div>

            <div id="game-player"><button class="close-btn" onclick="closeGame()">Exit to Hub</button><iframe id="gameFrame" src="about:blank"></iframe></div>
            
            <script>
                const games = [
                    { id: 1, title: "Slope", url: "/games/slope/index.html" },
                    { id: 2, title: "Retro Bowl", url: "/games/retro-bowl/index.html" },
                    { id: 3, title: "1v1.lol", url: "/games/1v1/index.html" },
                    { id: 4, title: "OvO", url: "/games/ovo/index.html" }
                ];
                function renderGames(gameList) {
                    const grid = document.getElementById('gameGrid');
                    grid.innerHTML = '';
                    gameList.forEach(game => {
                        const card = document.createElement('div');
                        card.className = 'game-card';
                        card.innerHTML = '<div class="game-cover">' + game.title + '</div><div class="game-info"><h3>' + game.title + '</h3></div>';
                        card.onclick = () => launchGame(game);
                        grid.appendChild(card);
                    });
                }
                let isGameLaunching = false;
                function launchGame(game) {
                    if (isGameLaunching) return;
                    isGameLaunching = true;
                    if (!sessionStorage.getItem('ad_shown')) {
                        sessionStorage.setItem('ad_shown', 'true');
                        setTimeout(() => { window.open('https://google.com', '_blank'); }, 500); // REPLACE WITH AADS POPUNDER LINK
                    }
                    document.getElementById('game-player').style.display = 'flex';
                    document.getElementById('gameFrame').src = game.url;
                    setTimeout(() => { isGameLaunching = false; }, 1000);
                }
                function closeGame() {
                    document.getElementById('game-player').style.display = 'none';
                    document.getElementById('gameFrame').src = 'about:blank';
                }
                function searchGames() {
                    const query = document.getElementById('searchInput').value.toLowerCase();
                    renderGames(games.filter(g => g.title.toLowerCase().includes(query)));
                }
                renderGames(games);
            </script>
        </body>
        </html>
    </script>

    <script>
        let isLaunching = false;

        function launchHub() {
            if (isLaunching) return;
            isLaunching = true;

            const popup = window.open('about:blank', 'AssignmentViewer', 'width=1200,height=800,menubar=no,toolbar=no,location=no,status=no');
            
            if (!popup) {
                alert("Please allow popups for this site.");
                isLaunching = false;
                return;
            }

            const template = document.getElementById('hub-template').innerHTML;

            popup.document.open();
            popup.document.write(template);
            popup.document.close();
            
            document.querySelector('.fake-page h1').innerText = "Assignment Loaded Successfully.";
            document.querySelector('.fake-page p').innerText = "You may now close this tab.";
            
            setTimeout(() => { isLaunching = false; }, 2000);
        }

        document.getElementById('click-trigger').addEventListener('click', launchHub);
    </script>

</body>
</html>
