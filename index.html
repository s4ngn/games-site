<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Hub</title>
    <style>
        /* Base Styles */
        :root { --primary: #a855f7; --bg: #09090b; --card-bg: #18181b; --text: #f4f4f5; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 220px; background: #121214; padding: 20px; border-right: 1px solid #27272a; display: flex; flex-direction: column; gap: 10px; }
        .logo { font-size: 24px; font-weight: 900; color: #fff; letter-spacing: 1px; margin-bottom: 20px; text-shadow: 0 0 10px var(--primary); }
        .nav-item { color: #a1a1aa; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: #27272a; color: #fff; }
        .nav-item.active { border-left: 3px solid var(--primary); }

        /* Main Content */
        .main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 0 20px 20px; }
        
        /* Top Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #27272a; margin-bottom: 20px; }
        .search-bar { background: #18181b; border: 1px solid #3f3f46; padding: 10px 15px; border-radius: 8px; color: #fff; width: 300px; outline: none; }
        .auth-buttons { display: flex; gap: 10px; }
        .btn { padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; }
        .btn-login { background: transparent; color: #fff; border: 1px solid #3f3f46; }
        .btn-signup { background: var(--primary); color: #fff; }

        /* Hero Section */
        .hero { background: linear-gradient(135deg, #2e1065, #09090b); border-radius: 12px; padding: 40px; margin-bottom: 30px; text-align: center; border: 1px solid #4c1d95; }
        .hero h1 { margin: 0; font-size: 36px; font-weight: 900; }
        .hero p { color: #d8b4fe; font-size: 18px; }
        .btn-play-now { background: #fff; color: #000; padding: 12px 30px; font-size: 18px; border-radius: 8px; margin-top: 15px; border: none; font-weight: bold; cursor: pointer; }

        /* Game Grid */
        .section-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .game-card { background: var(--card-bg); border-radius: 10px; overflow: hidden; cursor: pointer; border: 1px solid #27272a; transition: transform 0.2s, box-shadow 0.2s; }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(168, 85, 247, 0.2); border-color: var(--primary); }
        .game-card img { width: 100%; height: 120px; object-fit: cover; }
        .game-info { padding: 12px; }
        .game-info h3 { margin: 0; font-size: 15px; }
        .game-info p { margin: 5px 0 0; font-size: 12px; color: #a1a1aa; }

        /* Feedback Button */
        .feedback-btn { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white; border: none; border-radius: 50px; padding: 15px 25px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); z-index: 1000; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">ACADEMIC HUB</div>
        <div class="nav-item active">Home</div>
        <div class="nav-item">Trending</div>
        <div class="nav-item">New Games</div>
        <div class="nav-item">Categories</div>
        <div class="nav-item">Leaderboard</div>
    </div>

    <!-- Main Content -->
    <div class="main">
        <!-- Top Bar -->
        <div class="top-bar">
            <input type="text" class="search-bar" placeholder="Search for a game..." onkeyup="searchGames()" id="searchInput">
            <div class="auth-buttons">
                <button class="btn btn-login">Log In</button>
                <button class="btn btn-signup">Sign Up</button>
            </div>
        </div>

        <!-- Hero Section -->
        <div class="hero">
            <h1>PLAY MORE.<br>WAIT LESS.</h1>
            <p>The best unblocked games. All in one place.</p>
            <button class="btn-play-now">Start Playing</button>
        </div>

        <!-- Trending Games -->
        <div class="section-title">🔥 Trending Games</div>
        <div class="game-grid" id="gameGrid"></div>
    </div>

    <!-- Feedback Button -->
    <button class="feedback-btn" onclick="alert('Feedback modal coming soon!')">💬 Feedback</button>

    <script>
        // UPDATE YOUR GAME DATA HERE (Use real image links)
        const games = [
            { id: 1, title: "Slope", category: "action", img: "https://images.crazygames.com/slope/20220104095307/slope-cover.jpg", url: "/games/slope/index.html", plays: "9.8K" },
            { id: 2, title: "Retro Bowl", category: "sports", img: "https://play-lh.googleusercontent.com/nZg5lA4m8wJd8z2a8K2v3wQ2V4Z9X1bY7c6d5e4f3g2h1i0j", url: "/games/retro-bowl/index.html", plays: "7.2K" },
            { id: 3, title: "OvO", category: "platformer", img: "https://img.gamemonetize.com/ovo/512x384.jpg", url: "/games/ovo/index.html", plays: "6.1K" }
        ];

        function renderGames(gameList) {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            gameList.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <img src="${game.img}" alt="${game.title}" onerror="this.src='https://via.placeholder.com/180x120/18181b/a855f7?text=Game'">
                    <div class="game-info">
                        <h3>${game.title}</h3>
                        <p>${game.plays} playing</p>
                    </div>
                `;
                card.onclick = () => launchGame(game);
                grid.appendChild(card);
            });
        }

        // The Stealth Launcher (Ad + about:blank)
        function launchGame(game) {
            if (!sessionStorage.getItem('ad_shown')) {
                sessionStorage.setItem('ad_shown', 'true');
                window.open('https://google.com', '_blank'); // REPLACE WITH AADS LINK
            }

            const popup = window.open('about:blank', 'AssignmentViewer', 'width=1200,height=800,menubar=no,toolbar=no,location=no,status=no');
            
            if (popup) {
                const html = `
                    <html>
                    <head>
                        <title>Dashboard</title>
                        <style>body,html{margin:0;padding:0;height:100%;overflow:hidden;background:#000}iframe{width:100%;height:100%;border:none}</style>
                    </head>
                    <body>
                        <iframe src="${window.location.origin}${game.url}" credentialless allow="fullscreen; autoplay"></iframe>
                    </body>
                    </html>
                `;
                popup.document.open();
                popup.document.write(html);
                popup.document.close();
            } else {
                alert("Please allow popups to launch the game.");
            }
        }

        function searchGames() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            renderGames(games.filter(g => g.title.toLowerCase().includes(query)));
        }

        // Initialize
        renderGames(games);
    </script>
</body>
</html>
