<!DOCTYPE html>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        :root { --primary: #a855f7; --bg: #020810; --glass: rgba(20, 25, 35, 0.6); --border: rgba(255, 255, 255, 0.08); --text: #f4f4f5; }
        body { margin: 0; background: url('https://images.unsplash.com/photo-1514565131-fce0801e5785?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed; background-size: cover; color: var(--text); font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; backdrop-filter: blur(5px); }
        body::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 8, 16, 0.7); z-index: -1; }
        
        .sidebar { width: 240px; background: var(--glass); padding: 30px 20px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 15px; flex-shrink: 0; backdrop-filter: blur(20px); }
        .logo { font-size: 28px; font-weight: 800; color: #fff; letter-spacing: -1px; margin-bottom: 30px; text-shadow: 0 0 20px rgba(168, 85, 247, 0.8); }
        .nav-item { color: #a1a1aa; padding: 12px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .nav-item:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .nav-item.active { background: rgba(168, 85, 247, 0.15); color: #fff; border-left: 3px solid var(--primary); }
        
        .main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 40px; }
        .top-bar { display: flex; justify-content: center; align-items: center; margin-bottom: 40px; }
        .search-bar { background: rgba(0, 0, 0, 0.5); border: 1px solid var(--border); padding: 15px 25px; border-radius: 12px; color: #fff; width: 100%; max-width: 600px; outline: none; font-family: 'Inter', sans-serif; font-size: 16px; transition: 0.3s; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .search-bar:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
        .hero { background: linear-gradient(135deg, rgba(46, 16, 101, 0.8), rgba(9, 9, 11, 0.8)); border-radius: 16px; padding: 50px; margin-bottom: 40px; text-align: center; border: 1px solid rgba(168, 85, 247, 0.3); backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .hero h1 { margin: 0; font-size: 42px; font-weight: 800; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .hero p { color: #d8b4fe; font-size: 18px; font-weight: 400; margin-top: 10px; }
        .section-title { font-size: 22px; font-weight: 800; margin-bottom: 20px; color: #fff; letter-spacing: -0.5px; }
        
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .game-card { background: var(--glass); border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid var(--border); transition: 0.3s; display: flex; flex-direction: column; backdrop-filter: blur(10px); }
        .game-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 20px rgba(168, 85, 247, 0.2); }
        .game-cover { height: 130px; background: linear-gradient(135deg, rgba(46,16,101,0.5), rgba(9,9,11,0.5)); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #d8b4fe; font-size: 20px; text-align: center; padding: 10px; box-sizing: border-box; border-bottom: 1px solid var(--border); }
        .game-info { padding: 15px; text-align: center; }
        .game-info h3 { margin: 0; font-size: 16px; font-weight: 600; color: #fff; }
        
        .right-sidebar { width: 240px; background: var(--glass); padding: 15px 10px; border-left: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 10px; overflow-y: auto; flex-shrink: 0; backdrop-filter: blur(20px); }
        .ad-slot { width: 100%; flex: 1; min-height: 130px; display: flex; justify-content: center; align-items: center; border-radius: 8px; overflow: hidden; border: 1px solid transparent; }
        .ad-slot:hover { border-color: rgba(255,255,255,0.1); }

        #game-player { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; flex-direction: column; }
        #game-player iframe { width: 100%; height: 100%; border: none; }
        .close-btn { position: absolute; top: 15px; right: 25px; background: #ff4444; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; z-index: 1001; font-weight: 600; font-family: 'Inter', sans-serif; transition: 0.2s; }
        .close-btn:hover { background: #cc0000; }
    </style>
</head>

    <script>
        const games = [
            { id: 1, title: "Slope", url: "https://www.gamesforfree.com/embed/slope" },
            { id: 2, title: "Retro Bowl", url: "https://www.gamesforfree.com/embed/retro-bowl" },
            { id: 3, title: "1v1.lol", url: "https://www.gamesforfree.com/embed/1v1-lol" },
            { id: 4, title: "OvO", url: "https://www.gamesforfree.com/embed/ovo" }
        ];
        function renderGames(gameList) {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            gameList.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = '<div class="game-cover">' + game.title + '</div><div class="game-info"><h3>' + game.title + '</h3></div>';
                card.onclick = () => launchGame(game);
                grid.appendChild(card);
            });
        }
        
        let isGameLaunching = false;
        function launchGame(game) {
            if (isGameLaunching) return;
            isGameLaunching = true;
            
            // 1. FIRE THE POPUNDER (BYPASSES ADBLOCK)
            if (!sessionStorage.getItem('ad_shown')) {
                sessionStorage.setItem('ad_shown', 'true');
                setTimeout(() => { 
                    // THE DIRECT LINK TO YOUR A-ADS UNIT
                    window.open('https://acceptable.a-ads.com/2459198/?size=Adaptive', '_blank'); 
                }, 500); 
            }

            // 2. OPEN THE GAME
            document.getElementById('game-player').style.display = 'flex';
            document.getElementById('gameFrame').src = game.url;
            
            // 3. RESET CLICK LOCK
            setTimeout(() => { isGameLaunching = false; }, 1000);
        }
        
        function closeGame() {
            document.getElementById('game-player').style.display = 'none';
            document.getElementById('gameFrame').src = 'about:blank';
        }
        function searchGames() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            renderGames(games.filter(g => g.title.toLowerCase().includes(query)));
        }
        renderGames(games);
    </script>
